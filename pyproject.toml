[project]
name = "streaming-recommender"
version = "0.1.0"
description = "Production-grade streaming recommender — MAANG interview project"
requires-python = ">=3.10"

dependencies = [
    # Data
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",

    # ML core
    "torch>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",

    # Retrieval
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.6",

    # Serving
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "pydantic>=2.6",
    "httpx>=0.27",

    # Async task queue
    "celery[redis]>=5.3",

    # Observability
    "prometheus-client>=0.20",

    # Utilities
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "notebook>=7.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]